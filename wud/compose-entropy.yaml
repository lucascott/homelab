name: wud-entropy

secrets:
  OIDC_CLIENT_SECRET:
    file: OIDC_ENTROPY_CLIENT_SECRET.secret
  DOCKER_HUB_TOKEN:
    file: DOCKER_HUB_TOKEN.secret
  GHCR_TOKEN:
    file: GHCR_TOKEN.secret

networks:
  reverse-proxy:
    external: true

volumes:
  data: {}
  remote-sockets: {}

services:
  e-docker-socket-tunnel:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk add --no-cache openssh-client
    restart: unless-stopped
    network_mode: host
    volumes:
      # Passphrase-less SSH key
      - ~/.ssh/entropy.key:/root/.ssh/id_ed25519:ro
      - remote-sockets:/var/run/sockets
    command: >
      ssh -N
      -o ProxyCommand="ssh -o StrictHostKeyChecking=accept-new -W %h:%p lucascott@bastion.entropy.fi"
      -o ServerAliveInterval=15
      -o ServerAliveCountMax=3
      -o ExitOnForwardFailure=yes
      -o StreamLocalBindUnlink=yes
      -o StrictHostKeyChecking=accept-new
      -L /var/run/sockets/docker-e-docker.sock:/var/run/docker.sock
      lucascott@10.90.9.200

  e-proxy-socket-tunnel:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk add --no-cache openssh-client
    restart: unless-stopped
    network_mode: host
    volumes:
      # Passphrase-less SSH key
      - ~/.ssh/entropy.key:/root/.ssh/id_ed25519:ro
      - remote-sockets:/var/run/sockets
    command: >
      ssh -N
      -o ProxyCommand="ssh -o StrictHostKeyChecking=accept-new -W %h:%p lucascott@bastion.entropy.fi"
      -o ServerAliveInterval=15
      -o ServerAliveCountMax=3
      -o ExitOnForwardFailure=yes
      -o StreamLocalBindUnlink=yes
      -o StrictHostKeyChecking=accept-new
      -L /var/run/sockets/docker-e-proxy.sock:/var/run/docker.sock
      lucascott@10.90.9.201

  whatsupdocker:
    image: getwud/wud:latest
    restart: unless-stopped
    depends_on:
      - e-docker-socket-tunnel
      - e-proxy-socket-tunnel
    secrets:
      - OIDC_CLIENT_SECRET
      - DOCKER_HUB_TOKEN
      - GHCR_TOKEN
    environment:
      # Watchers
      WUD_WATCHER_E-PROXY_SOCKET: /var/run/remote-sockets/docker-e-proxy.sock
      WUD_WATCHER_E-DOCKER_SOCKET: /var/run/remote-sockets/docker-e-docker.sock
      # Auth configs
      WUD_PUBLIC_URL: https://wud-entropy.lucascott.com
      WUD_AUTH_OIDC_AUTH_CLIENTID: 4af431b5-6056-40be-bc0c-439c0396d678
      # double underscore is unconventional yet correct for WUD (https://getwud.github.io/wud/#/configuration/?id=secret-management)
      WUD_AUTH_OIDC_AUTH_CLIENTSECRET__FILE: /run/secrets/OIDC_CLIENT_SECRET
      WUD_AUTH_OIDC_AUTH_DISCOVERY: https://auth.lucascott.com/.well-known/openid-configuration
      WUD_AUTH_OIDC_AUTH_ADMINGROUP: wud-admins
      WUD_REGISTRY_HUB_PUBLIC_LOGIN: lucascott
      WUD_REGISTRY_HUB_PUBLIC_PASSWORD__FILE: /run/secrets/DOCKER_HUB_TOKEN
      WUD_REGISTRY_GHCR_PUBLIC_USERNAME: lucascott
      WUD_REGISTRY_GHCR_PUBLIC_TOKEN__FILE: /run/secrets/GHCR_TOKEN
      # manual trigger for updating containers
      WUD_TRIGGER_DOCKER_UPDATE_AUTO: false
      WUD_TRIGGER_DOCKER_UPDATE_PRUNE: true
      # autoupdate trigger for updating selected containers
      WUD_TRIGGER_DOCKER_AUTOUPDATE_INCLUDEBYDEFAULT: false
      WUD_TRIGGER_DOCKER_AUTOUPDATE_AUTO: true
      WUD_TRIGGER_DOCKER_AUTOUPDATE_PRUNE: true
    volumes:
      - remote-sockets:/var/run/remote-sockets:ro
      - data:/store
    networks:
      - reverse-proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`wud-entropy.lucascott.com`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.domains[0].sans=*.lucascott.com
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=internalOnly@file
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000
      - wud.watch.digest=true
      - wud.link.template=https://github.com/getwud/wud/releases
