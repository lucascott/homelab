secrets:
  TELEGRAM_BOT_TOKEN:
    file: TELEGRAM_BOT_TOKEN.secret
  OIDC_CLIENT_SECRET:
    file: OIDC_CLIENT_SECRET.secret
  DOCKER_HUB_TOKEN:
    file: DOCKER_HUB_TOKEN.secret
  GHCR_TOKEN:
    file: GHCR_TOKEN.secret

networks:
  reverse-proxy:
    external: true

volumes:
  data: {}

services:
  whatsupdocker:
    image: getwud/wud:latest
    restart: unless-stopped
    secrets:
      - TELEGRAM_BOT_TOKEN
      - OIDC_CLIENT_SECRET
      - DOCKER_HUB_TOKEN
      - GHCR_TOKEN
    environment:
      WUD_PUBLIC_URL: https://${COMPOSE_PROJECT_NAME}.lucascott.com
      WUD_AUTH_OIDC_AUTH_CLIENTID: fd546872-74bc-4f43-9efe-18748d9aafcd
      # double underscore is unconventional yet correct for WUD (https://getwud.github.io/wud/#/configuration/?id=secret-management)
      WUD_AUTH_OIDC_AUTH_CLIENTSECRET__FILE: /run/secrets/OIDC_CLIENT_SECRET
      WUD_AUTH_OIDC_AUTH_DISCOVERY: https://auth.lucascott.com/.well-known/openid-configuration
      WUD_REGISTRY_HUB_PUBLIC_LOGIN: lucascott
      WUD_REGISTRY_HUB_PUBLIC_PASSWORD__FILE: /run/secrets/DOCKER_HUB_TOKEN
      WUD_REGISTRY_GHCR_PUBLIC_USERNAME: lucascott
      WUD_REGISTRY_GHCR_PUBLIC_TOKEN__FILE: /run/secrets/GHCR_TOKEN
      # trigger for update notifications
      WUD_TRIGGER_TELEGRAM_NOTIFY_BOTTOKEN__FILE: /run/secrets/TELEGRAM_BOT_TOKEN
      WUD_TRIGGER_TELEGRAM_NOTIFY_CHATID: 30646137
      WUD_TRIGGER_TELEGRAM_NOTIFY_DISABLETITLE: true
      WUD_TRIGGER_TELEGRAM_NOTIFY_MESSAGEFORMAT: HTML
      WUD_TRIGGER_TELEGRAM_NOTIFY_SIMPLEBODY__FILE: /tmp/notify_simplebody.html
      # trigger for autoupdate reports
      WUD_TRIGGER_TELEGRAM_REPORT_BOTTOKEN__FILE: /run/secrets/TELEGRAM_BOT_TOKEN
      WUD_TRIGGER_TELEGRAM_REPORT_INCLUDEBYDEFAULT: false
      WUD_TRIGGER_TELEGRAM_REPORT_CHATID: 30646137
      WUD_TRIGGER_TELEGRAM_REPORT_DISABLETITLE: true
      WUD_TRIGGER_TELEGRAM_REPORT_MESSAGEFORMAT: HTML
      WUD_TRIGGER_TELEGRAM_REPORT_SIMPLEBODY__FILE: /tmp/report_simplebody.html
      # manual trigger for updating containers
      WUD_TRIGGER_DOCKER_UPDATE_AUTO: false
      WUD_TRIGGER_DOCKER_UPDATE_PRUNE: true
      # autoupdate trigger for updating selected containers
      WUD_TRIGGER_DOCKER_AUTOUPDATE_INCLUDEBYDEFAULT: false
      WUD_TRIGGER_DOCKER_AUTOUPDATE_AUTO: true
      WUD_TRIGGER_DOCKER_AUTOUPDATE_PRUNE: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/store
      - ./notify_simplebody.html:/tmp/notify_simplebody.html:ro
      - ./report_simplebody.html:/tmp/report_simplebody.html:ro
    networks:
      - reverse-proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.lucascott.com`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.domains[0].sans=*.lucascott.com
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=internalOnly@file
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000
      - wud.watch.digest=true
      - wud.link.template=https://github.com/getwud/wud/releases
      - wud.trigger.include=telegram.report,docker.autoupdate
